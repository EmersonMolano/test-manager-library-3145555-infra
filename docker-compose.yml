services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [library]

  api:
    build:
      context: ../test-manager-library-3145555-api
    environment:
      APP_ENV: local
      APP_KEY: base64:ZmFrZS1hcHBrZXktZm9yLWRldmVsb3BtZW50
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: library
      DB_USERNAME: library
      DB_PASSWORD: library
      JWT_SECRET: local-development-secret-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-now
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - library_covers:/var/www/html/storage/app/covers
    networks: [library]

  app:
    build:
      context: ../test-manager-library-3145555-app
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on: [api]
    ports:
      - "5173:5173"
    networks: [library]

  page:
    build:
      context: ../test-manager-library-3145555-page
    ports:
      - "8080:80"
    networks: [library]

  tool:
    profiles: [tools]
    build:
      context: ../test-manager-library-3145555-tool
    environment:
      API_URL: http://api:8000/api/v1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-now
    depends_on: [api]
    networks: [library]

volumes:
  library_pgdata:
  library_covers:

networks:
  library:
